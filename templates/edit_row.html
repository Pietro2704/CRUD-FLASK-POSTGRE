{% extends "base.html" %}

{% block title %}Editar registro{% endblock %}

{% block content %}
<p>
  <a href="{{ url_for('view_table', dbname=dbname, table_name=table_name) }}" class="link-underline-opacity-0">
    <i class="bi bi-arrow-left"></i> Voltar
  </a>
</p>
<h1 class="h3 mb-4 text-brand"><i class="bi bi-pencil-square"></i> Editar registro #{{ row.id }}</h1>

<div class="card card-brand shadow-sm">
  <div class="card-body">
    <form method="post" class="row g-3">
      {% for col in editable_columns %}
        <div class="col-sm-6 col-lg-4">
          <label class="form-label">{{ col[0] }} <small class="text-body-secondary">({{ col[1] }})</small></label>
          <input type="text" class="form-control" name="{{ col[0] }}"
                 value="{{ row[col[0]] if row[col[0]] is not none else '' }}"
                 {% if col[2] == 'NO' %}required{% endif %}>
        </div>
      {% endfor %}
      <div class="col-12">
        <button type="submit" class="btn btn-primary">
          <i class="bi bi-check-lg"></i> Salvar
        </button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
